[project]
name = "ai-radar"
version = "0.1.0"
description = "Gunluk AI radari: gorsel/video/oyun/3D uretimi ekseninde kaynak toplama, skorlama ve statik yayin"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.11",
    "PyYAML>=6.0",
]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]
